<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Calendar check</title>
</head>
<body>
  <pre id="out">running</pre>
  <script src="../vendor/hebcal/hebcal-core.min.js"></script>
  <script type="module">
    import { createCalendar, akronWallTimeToDate } from '../js/calendar.js';
    import { isCurrentEvent, inDateRange, nextOccurrence, upcomingEvents } from '../js/events.js';
    import { TEMPLATES } from '../js/templates.js';
    import { albumKey, cleanAlbumLink, parseAlbumPage, albumLinksInBoard } from '../js/albums.js';
    import { canonicalFont, extraFontsUsed } from '../js/type.js';
    import { classifyImageLine } from '../js/images.js';
    import { normalizeConfig, pickTv } from '../js/model.js';
    import { parseDriveFolderId, explainDriveError } from '../js/drive.js';

    const failures = [];
    const check = (name, ok, detail) => {
      if (!ok) failures.push(name + (detail ? ' - ' + detail : ''));
    };
    const time = (value) => String(value || '').replace(/\s/g, '').toLowerCase();

    const cal = createCalendar(globalThis.hebcal);
    const wed = new Date('2026-11-18T18:00:00Z');
    const he = cal.hebrew(wed);
    check('weekday', he.weekday === 'Wednesday', he.weekday);
    check('civil', he.dateLine === 'November 18, 2026', he.dateLine);
    check('translit', he.translit.includes('Kislev') && he.translit.includes('8'), he.translit);
    check('hebrew letters', he.hebrew.includes('כ') && he.hebrew.includes('תשפ'), he.hebrew);
    const sh = cal.shabbos(wed, { candleLightingMins: 18, havdalahMode: 'degrees', havdalahDeg: 8.5 });
    check('parsha', sh.parsha.en === 'Parashat Vayetzei', sh.parsha.en);
    check('parsha he', sh.parsha.he.includes('וַיֵּצֵא') || sh.parsha.he.includes('ויצא'), sh.parsha.he);
    check('candles', time(sh.candles.time) === '4:45pm', sh.candles.time);
    check('havdalah', time(sh.havdalah.time) === '5:47pm', sh.havdalah.time);
    check('candle day', sh.candles.when.includes('Friday') && sh.candles.when.includes('20'), sh.candles.when);

    const afterSunset = cal.hebrew(new Date('2026-11-18T23:00:00Z'));
    check('after sunset', afterSunset.translit.includes('9'), afterSunset.translit + ' / ' + afterSunset.hebrew);

    const motzei = new Date('2026-11-21T23:30:00Z');
    const next = cal.shabbos(motzei, { candleLightingMins: 18, havdalahMode: 'degrees', havdalahDeg: 8.5 });
    check('next parsha', next.parsha.en === 'Parashat Vayishlach', next.parsha.en);
    check('next candles', time(next.candles.time) === '4:41pm', next.candles.time);
    check('next havdalah', time(next.havdalah.time) === '5:44pm', next.havdalah.time);

    const mins = cal.shabbos(wed, { candleLightingMins: 18, havdalahMode: 'minutes', havdalahMins: 42 });
    check('42 min havdalah', time(mins.havdalah.time) === '5:45pm', mins.havdalah.time);

    const wall = akronWallTimeToDate(2026, 11, 20, 16, 45);
    check('akron instant', wall.toISOString() === '2026-11-20T21:45:00.000Z', wall.toISOString());

    check('past event', !isCurrentEvent({ title: 'Old', date: '2026-11-01', time: '10:00' }, wed));
    check('future event', isCurrentEvent({ title: 'Erev', date: '2026-11-20', time: '16:45' }, wed));

    const album = classifyImageLine('https://photos.app.goo.gl/example');
    check('photos rejected', album.error === 'photos-album');
    const drive = classifyImageLine('https://drive.google.com/file/d/abc123XYZ/view');
    check('drive image', drive.url === 'https://lh3.googleusercontent.com/d/abc123XYZ=w2400', drive.url);

    const z = cal.zmanim(wed);
    const sunset = z.items.find((item) => item.key === 'sunset');
    check('sunset present', Boolean(sunset && sunset.time));

    const migrated = normalizeConfig({
      version: 1,
      orientation: 'portrait',
      screens: [{ id: 'main', name: 'Main', widgets: [{ id: 'w', type: 'text', settings: { title: 'Hi' } }] }],
      takeover: { title: 'Old message' },
    });
    check('one tv', migrated.tvs.length === 1 && migrated.tvs[0].name === 'Lobby' && migrated.tvs[0].id === 'lobby');
    check('kept shape', migrated.tvs[0].orientation === 'portrait');
    check('kept words', migrated.tvs[0].screens[0].widgets[0].settings.title === 'Hi');
    check('kept message', migrated.tvs[0].takeover.title === 'Old message');
    check('classic theme', migrated.tvs[0].theme.preset === 'warm-classic' && migrated.tvs[0].theme.font === 'elegant');
    check('default tv', pickTv(migrated, '').id === 'lobby');
    const pair = normalizeConfig({ tvs: [{ id: 'lobby', name: 'Lobby' }, { id: 'social-hall', name: 'Social hall' }] });
    check('tv number', pickTv(pair, '2').id === 'social-hall');
    check('tv slug', pickTv(pair, 'social-hall').id === 'social-hall');
    check('no double wrap', normalizeConfig(migrated).tvs.length === 1);

    // Weekly events are entered once and show their next date.
    const weekly = { title: 'Gemara', date: '2026-11-03', time: '20:00', repeat: 'weekly' };
    check('weekly next', nextOccurrence(weekly, wed)?.date === '2026-11-24', nextOccurrence(weekly, wed)?.date);
    check('weekly is current', isCurrentEvent(weekly, wed));
    check('weekly until', !isCurrentEvent({ ...weekly, until: '2026-11-17' }, wed));
    const biweekly = { title: 'Lunch', date: '2026-11-04', time: '12:00', repeat: 'biweekly' };
    check('biweekly next', nextOccurrence(biweekly, wed)?.date === '2026-12-02', nextOccurrence(biweekly, wed)?.date);
    check('upcoming sorted', upcomingEvents([weekly, { title: 'Erev', date: '2026-11-20', time: '16:45' }], wed)[0].title === 'Erev');

    // Pieces with dates.
    check('in range', inDateRange({ showFrom: '2026-11-15', showUntil: '2026-11-18' }, wed));
    check('after range', !inDateRange({ showUntil: '2026-11-17' }, wed));
    check('before range', !inDateRange({ showFrom: '2026-11-19' }, wed));

    // Shabbos mode window: 20 minutes before 4:45 PM Friday until 10 minutes after 5:47 PM Saturday.
    const rest = cal.restWindow(wed, {}, { before: 20, after: 10, yomTov: true });
    check('rest start', rest && rest.start.toISOString() === '2026-11-20T21:25:00.000Z', rest && rest.start.toISOString());
    check('rest not yet', rest && rest.active === false);
    const friday = cal.restWindow(new Date('2026-11-20T22:00:00Z'), {}, { before: 20, after: 10 });
    check('rest active friday', friday && friday.active && friday.kind === 'shabbos');
    const motzeiLate = cal.restWindow(new Date('2026-11-21T23:10:00Z'), {}, { before: 20, after: 10 });
    check('rest over', motzeiLate && motzeiLate.active === false && motzeiLate.start.toISOString().startsWith('2026-11-27'), motzeiLate && motzeiLate.start.toISOString());

    // Ready layouts stay inside the screen.
    const inside = (p) => p && p.x >= 0 && p.y >= 0 && p.x + p.w <= 100 && p.y + p.h <= 100;
    check('templates fit', TEMPLATES.every((t) => t.items.every((i) => inside(i.landscape) && inside(i.portrait))));

    // Old per-piece font names still work, and extra fonts are counted.
    check('old font name', canonicalFont('elegant') === 'fraunces');
    const fontTv = { screens: [{ widgets: [{ settings: { type: { parts: { title: { font: 'inter' }, small: { font: 'modern' } } } } }] }] };
    check('fonts counted', extraFontsUsed(fontTv).size === 2);

    const modern = normalizeConfig({ tvs: [{ id: 'lobby', theme: { preset: 'midnight' }, shabbosMode: { enabled: true, screenId: 'main' } }], google: { photosClientId: 'x.apps.googleusercontent.com' } });
    check('modern theme', modern.tvs[0].theme.preset === 'midnight' && modern.tvs[0].theme.cards === 'glass');
    check('shabbos mode kept', modern.tvs[0].shabbosMode.enabled && modern.tvs[0].shabbosMode.screenId === 'main');
    check('google kept', modern.google.photosClientId === 'x.apps.googleusercontent.com');
    check('fade default', modern.tvs[0].transition === 'fade');

    // Google Photos album links.
    check('album short link', cleanAlbumLink(' https://photos.app.goo.gl/AbC123?x=1 ') === 'https://photos.app.goo.gl/AbC123');
    check('album share link', cleanAlbumLink('https://photos.google.com/share/AF1Qip?key=abc') === 'https://photos.google.com/share/AF1Qip?key=abc');
    check('not an album', cleanAlbumLink('https://example.com/x') === '');
    check('album key stable', albumKey('https://photos.app.goo.gl/AbC123') === albumKey('https://photos.app.goo.gl/AbC123?y') && albumKey('https://photos.app.goo.gl/AbC123').length === 16);
    const sample = parseAlbumPage('<meta property="og:title" content="TV &amp; Lobby">["https://lh3.googleusercontent.com/pw/AP1",400,300,null]["https://lh3.googleusercontent.com/a/OWNER",96,96]["https://lh3.googleusercontent.com/pw/AP1",400,300]');
    check('album parse', sample.title === 'TV & Lobby' && sample.photos.length === 1 && sample.photos[0].w === 400);
    check('album links on board', albumLinksInBoard({ tvs: [{ screens: [{ widgets: [{ type: 'photos', settings: { albumLink: 'https://photos.app.goo.gl/Z9' } }] }] }] }).length === 1);

    const folder = 'https://drive.google.com/drive/u/0/folders/1Tep1UDuT2HOGwzOWKeWkM_TevH3D5gSd?usp=sharing';
    check('folder id', parseDriveFolderId(folder) === '1Tep1UDuT2HOGwzOWKeWkM_TevH3D5gSd');
    check('folder query', parseDriveFolderId('https://drive.google.com/embeddedfolderview?id=abc_def-123') === 'abc_def-123');
    check('not a folder', parseDriveFolderId('https://photos.app.goo.gl/example') === '');
    check('bad key words', explainDriveError(new Error('API key not valid. Please pass a valid API key.')).includes('not valid'));

    document.getElementById('out').textContent = failures.length
      ? 'FAIL\n' + failures.join('\n')
      : 'PASS\n' + [he.hebrew, he.translit, sh.parsha.en, sh.parsha.he, sh.candles.time, sh.havdalah.time, sunset.time].join('\n');
    window.__ready = true;
    window.__pass = failures.length === 0;
  </script>
</body>
</html>
