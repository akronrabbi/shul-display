<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Edit the lobby display - Anshe Sfard</title>
  <link rel="stylesheet" href="./vendor/fonts/fonts.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/widgets.css">
  <link rel="stylesheet" href="./css/editor.css">
  <style>html,body{background:#f4f4f2}</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="brand-mark" src="./assets/akron-shul-logo.png" alt="">
      <div>
        <h1 class="brand-name">Anshe Sfard</h1>
        <p class="brand-sub">Lobby display</p>
      </div>
    </div>
    <div class="top-end">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="icon-group" role="group" aria-label="Undo and redo">
        <button type="button" class="btn icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
        <button type="button" class="btn icon" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">&#8631;</button>
      </div>
      <button type="button" class="btn" id="week">This week</button>
      <button type="button" class="btn" id="templates">Ready layouts</button>
      <div class="more-wrap">
        <button type="button" class="btn menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="top-actions">More</button>
        <div class="top-actions" id="top-actions">
          <button type="button" class="btn" id="open-tv">Open the TV</button>
          <button type="button" class="btn" id="layouts">Saved layouts</button>
          <button type="button" class="btn" id="history">History</button>
          <button type="button" class="btn" id="import">Import a file</button>
          <button type="button" class="btn" id="export">Export a file</button>
          <button type="button" class="btn" id="reload-published">Load published layout</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="save" title="Save (Ctrl+S)">Save</button>
    </div>
  </header>
  <section class="signin" id="signin">
    <div>
      <h2>Sign in to save</h2>
      <p>The first time, sign in with rabbi@akronshul.com. Google is the usual way. An email code works if Google does not.</p>
    </div>
    <div class="signin-actions">
      <button type="button" class="btn btn-primary" id="google-sign-in">Continue with Google</button>
      <button type="button" class="btn" id="email-start">Use an email code instead</button>
      <div id="email-code" hidden>
        <label>Email
          <input id="auth-email" type="email" autocomplete="username" inputmode="email" placeholder="rabbi@akronshul.com">
        </label>
        <button type="button" class="btn" id="email-send">Send the code</button>
        <div id="code-row" hidden>
          <label>Code
            <input id="auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
          </label>
          <button type="button" class="btn btn-primary" id="email-verify">Sign in</button>
        </div>
      </div>
      <p class="auth-message" id="auth-message"></p>
    </div>
  </section>
  <div class="who" id="who" hidden>
    <span>Signed in as <strong id="who-email"></strong></span>
    <button type="button" class="btn" id="sign-out">Sign out</button>
  </div>
  <div class="tv-bar">
    <select id="tv-select" class="tv-select" aria-label="Which TV"></select>
    <div class="tv-tabs" id="tv-tabs" role="tablist" aria-label="Which TV"></div>
    <span class="tv-status" id="tv-status" hidden></span>
    <label class="tv-name-label">Name <input id="tv-name" type="text" maxlength="40" aria-label="TV name"></label>
    <label class="rotate-control">Rotate design to fit screen
      <select id="tv-rotate" aria-label="Rotate design to fit screen">
        <option value="0">Off</option>
        <option value="90">90° right</option>
        <option value="180">180°</option>
        <option value="270">90° left</option>
      </select>
    </label>
    <p class="rotate-hint">Turns the design on the TV to match a screen mounted sideways. It does not move the screen itself.</p>
    <div class="tv-address">
      <span>Address</span>
      <code id="tv-url"></code>
      <button type="button" class="btn" id="copy-link">Copy link</button>
      <button type="button" class="btn" id="delete-tv">Remove this TV</button>
    </div>
  </div>
  <div class="workspace">
    <aside class="palette" id="palette"></aside>
    <main class="board">
      <div class="board-bar">
        <div class="segment" role="group" aria-label="Screen shape">
          <button type="button" id="orient-land">Landscape</button>
          <button type="button" id="orient-port">Portrait</button>
        </div>
        <div class="tabs" id="tabs"></div>
        <label class="choice"><input type="checkbox" id="cycle"> Cycle through screens</label>
        <button type="button" class="btn" id="screen-settings">Screen settings</button>
      </div>
      <div class="board-frame" id="board-frame">
        <div class="screen-canvas" id="canvas"></div>
      </div>
    </main>
    <button type="button" class="sheet-backdrop" id="sheet-backdrop" aria-label="Close settings"></button>
    <aside class="inspector" id="inspector-panel">
      <div class="sheet-bar">
        <strong id="sheet-title">This piece</strong>
        <button type="button" class="btn" id="sheet-done">Done</button>
      </div>
      <div class="inspector-body" id="inspector"></div>
    </aside>
  </div>
  <script src="./vendor/hebcal/hebcal-core.min.js"></script>
  <script type="module" src="./js/editor.js"></script>
</body>
</html>
